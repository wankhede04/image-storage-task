services:
  postgres:
    image: postgres:16-alpine
    container_name: aragon_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aragon
      POSTGRES_PASSWORD: aragon
      POSTGRES_DB: aragon_db
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aragon -d aragon_db']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aragon_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio
    container_name: aragon_minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc
    container_name: aragon_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/aragon-images &&
      mc anonymous set none local/aragon-images &&
      echo 'MinIO bucket ready'
      "
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://aragon:aragon@postgres:5432/aragon_db
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      # Only the api container generates presigned URLs — browsers/host tools can't
      # resolve the container-internal "minio" hostname, so URLs must use the
      # host-published endpoint instead.
      S3_PUBLIC_ENDPOINT: http://localhost:9000
    ports:
      - '3001:3001'
    restart: unless-stopped

  validation-worker:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ['node', 'dist/workers/validationWorker.js']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://aragon:aragon@postgres:5432/aragon_db
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    restart: unless-stopped

  conversion-worker:
    build: { context: ., dockerfile: server/Dockerfile }
    command: ['node', 'dist/workers/conversionWorker.js']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://aragon:aragon@postgres:5432/aragon_db
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      # Cap libvips CPU parallelism per replica so one replica ~ one core of image work;
      # scale throughput by adding replicas (--scale) instead of oversubscribing cores.
      VIPS_CONCURRENCY: '1'
    restart: unless-stopped

  compression-worker:
    build: { context: ., dockerfile: server/Dockerfile }
    command: ['node', 'dist/workers/compressionWorker.js']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://aragon:aragon@postgres:5432/aragon_db
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      # Cap libvips CPU parallelism per replica so one replica ~ one core of image work;
      # scale throughput by adding replicas (--scale) instead of oversubscribing cores.
      VIPS_CONCURRENCY: '1'
    restart: unless-stopped

  variant-worker:
    build: { context: ., dockerfile: server/Dockerfile }
    command: ['node', 'dist/workers/variantWorker.js']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://aragon:aragon@postgres:5432/aragon_db
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      # Cap libvips CPU parallelism per replica so one replica ~ one core of image work;
      # scale throughput by adding replicas (--scale) instead of oversubscribing cores.
      VIPS_CONCURRENCY: '1'
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
